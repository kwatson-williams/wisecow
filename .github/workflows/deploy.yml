name: CI/CD Wisecow Build and Push

on:
  push:
    branches: [ "main" ] # Triggers automatically when code hits the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    
    # Step 1: Clone your code workspace onto the GitHub runner environment
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    # Step 2: Establish a secure connection login session to your Docker Hub registry
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    # Step 3: Run the building automation engines against your project Dockerfile
    - name: Build and Tag Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/wisecow:latest .

    # Step 4: Publish your finished, packaged application image live to the registry
    - name: Push Image to Docker Hub Registry
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/wisecow:latest
